<!DOCTYPE html>
<HTML>
    <head>
        <meta name = "viewport" content = "width=device-width, initial-scale=1, viewport-fit=cover">
        <script>
            (function () {
                function syncViewport() {
                    var vv = window.visualViewport;
                    var root = document.documentElement.style;
                    root.setProperty("--vv-width", (vv ? vv.width : window.innerWidth) + "px");
                    root.setProperty("--vv-height", (vv ? vv.height : window.innerHeight) + "px");
                }
                syncViewport();
                window.addEventListener("resize", syncViewport);
                if (window.visualViewport) {
                    visualViewport.addEventListener("resize", syncViewport);
                    visualViewport.addEventListener("scroll", syncViewport);
                }
            })();
        </script>
        <link rel = "stylesheet" href = "style.css">
        <link rel = "stylesheet" href = "ui/style.css">

        <script type="importmap">
            {"imports":{"vue":"./ui/vue.js","@vue/reactivity":"./ui/reactivity.js","game/game-time":"./src/game_time.js","game/display":"./src/display.js","game/locations":"./src/locations.js","game/realms":"./src/realms.js","game/ui-state":"./src/ui_state.js","game/t":"./src/i18n.js","game/main":"./src/main.js","game/character":"./src/character.js","game/items":"./src/items.js","game/skills":"./src/skills.js","game/misc":"./src/misc.js","game/enemies":"./src/enemies.js","game/gems":"./src/gems.js","game/stances":"./src/combat_stances.js","game/traders":"./src/traders.js","game/trade":"./src/trade.js","game/dialogues":"./src/dialogues.js","game/activities":"./src/activities.js","game/crafting-recipes":"./src/crafting_recipes.js"}}
        </script>
        <script type="module" src="src/HackTimer/HackTimer.min.js"></script>
        <script type="module" src = "src/main.js"> </script>
        <script type="module" src="ui/boot.js"></script>

        <!--Icons-->
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

        <!--favicon-->
        <link rel="icon" href="favicon.ico" type="image/x-icon">



        <Title>Neko RPG</Title>
    </head>


    <body>
        <div id = "loading_screen">
            LOADING
        </div>
        <audio id="bgm" loop preload="auto">
        </audio>

        <div id="screen_effects" data-island="screen-effects"></div>

        <div id = "screen">
        <div id = "main_content">

            <div id = "global_content"> <!-- stuff that needs to be available in both area page and character page-->

                <div id = "time_and_location" class = "box_div" data-island="time-and-location"></div>

                <!-- inventory list -->
                <div id = "inventory_div" class = "box_div" data-island="inventory"></div>

                <div id = "character_combat_management" class = "box_div" data-island="combat-management"></div>

                <div id = "inventory_combat_switch_selection" class="box_div activable_buttons" data-island="panel-switch"></div>

                <!-- location info (name, type[safe/combat], weather, time, etc?)-->
                <div id = "location_div" class = "box_div" data-island="location-description"></div>

                <div id = "combat_div" class = "box_div" data-island="combat"></div>
                
                <!-- actions and stuff-->
                <div id = "location_related_div" class = "box_div">
                    <div id = "mini_games_div" data-island="minigames"></div>
                    <div id = "location_actions_div" data-island="location-actions">
                    </div>


                    <div id = "trade_div" data-island="trade"></div>

                    <div id = "crafting_window" class="crafting_window" data-island="crafting"></div>
                </div>

                <div id="skills_and_stances_div" class="box_div">
                    <div id = "skill_list_div" data-island="skills"></div>
                    <div id = "stance_list_div" data-island="stances"></div>
                    <div id = "family_div" data-island="family"></div>
                    <div id = "skill_and_stance_control_div" class="activable_buttons" data-island="skill-controls"></div>
                </div>
                <div id = "engine_div" class = "box_div" data-island="engine"></div>

                <div id = "journal_div" class = "box_div">
                    <div id = "journal_control_div" class="activable_buttons" data-island="journal-controls"></div>
                    <div id = "quests_box_div" data-island="quests"></div>
                    <div id = "bestiary_box_div" data-island="bestiary"></div>
                    <div id = "levelary_box_div" data-island="levelary"></div>
                    <div id = "data_box_div" data-island="data-box"></div>
                </div>

                <!-- character stats and equipment-->
                <div id = "character_div" class = "box_div"> 
                    <div id = "character_stats_div" data-island="character-stats"></div>

                    <div id = "character_equipment_div" data-island="equipment"></div>

                    <div id = "character_tools_div" data-island="tools"></div>

                    <div id = "character_control_div" class="activable_buttons" data-island="character-controls"></div>
                </div>


            <!-- message log -->
            <div id = "message_log_div" class = "box_div" data-island="message-log"></div>
        </div>

        <div id = "bottom_panel_div" data-island="bottom-bar"></div>
        </div>

        <div id="options_panel" data-island="options"></div>
        <div id="help_panel" data-island="help"></div>

        
    </body>
</HTML>
